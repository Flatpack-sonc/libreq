name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Sanitizer tests
        run: make CC=${{ matrix.cc }} test SANITIZE=1 && make CC=${{ matrix.cc }} cpp SANITIZE=1
      - name: Release build tests
        run: make clean && make CC=${{ matrix.cc }} test
      - name: CMake
        run: |
          cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DREQ_SANITIZE=ON -DREQ_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: libFuzzer smoke run
        run: make fuzz CC=clang FUZZ_TIME=60

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: OpenSSL
        run: brew install openssl@3
      - name: Tests
        run: |
          PREFIX="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I$PREFIX/include"
          export OPENSSL_LIBS="-L$PREFIX/lib -lssl -lcrypto"
          make test
      - name: CMake
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake -B build -DREQ_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
